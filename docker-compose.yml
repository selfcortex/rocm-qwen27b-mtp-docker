# ============================================================================
# llama.cpp (ROCm) inference + local monitoring stack
#
#   Monitoring (always on, restart: unless-stopped):
#     docker compose up -d
#
#   Inference session (starts/stops the GPU server; monitoring stays up):
#     ./run.sh
#     # or: docker compose --profile llama up -d --force-recreate llama-server
#     #      docker compose --profile llama stop llama-server
#
#   Secrets live in .env (gitignored). Copy .env.example and fill it in.
#   Published ports: only Grafana and the llama API, both bound to LAN_IP
#   (never 0.0.0.0); the llama API is additionally on 127.0.0.1 for run.sh.
#   Prometheus and node-exporter are internal to the compose network.
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # llama.cpp server - ROCm, bridge network (loopback + LAN only), managed by ./run.sh (profile "llama")
  # ---------------------------------------------------------------------------
  llama-server:
    # llama.cpp v1.0.0-dev, build 12375 (commit 9d25e0014), ROCm 7.2.1.
    # Pinned by digest so the serving/metrics behavior stays reproducible.
    image: ghcr.io/ggml-org/llama.cpp@sha256:6da04cde049c6410fd93a45810dc2072ea8c8041ad9fc091f48e3064e322fb83
    container_name: llama-qwen27b
    restart: "no"
    profiles: ["llama"]
    # Bridge network: the API is published to loopback only (run.sh agents)
    # and to the LAN IP (phone client). network_mode: host exposed it on
    # every host interface; GPU access (devices, ipc: host) is unaffected.
    ports:
      - "127.0.0.1:8080:8080"
      - "${LAN_IP:?set LAN_IP in .env}:8080:8080"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:?set VIDEO_GID in .env (getent group video)}"
      - "${RENDER_GID:?set RENDER_GID in .env (getent group render)}"
    ipc: host
    security_opt:
      - seccomp:unconfined
    environment:
      # Only the gfx override: AMD_SERIALIZE_KERNEL/HSA_OVERCOMMIT are
      # default no-ops, and the other LLAMA_ARG_* env vars were shadowed
      # by the CLI flags below (the server logged a warning for each one).
      # The CLI is the single source of truth.
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
    volumes:
      # Single-file read-only mounts: the container sees only the two model
      # files, not the rest of the host filesystem. Paths come from .env.
      - "${MODEL_FILE:?set MODEL_FILE in .env}:/model/model.gguf:ro"
      - "${MMPROJ_FILE:?set MMPROJ_FILE in .env}:/model/mmproj.gguf:ro"
      - ./secrets/llama_api_key:/run/secrets/llama_api_key:ro
      # Writable dir for KV snapshots (POST /slots/0?action=save|restore).
      # run.sh restores the snapshot at start and re-saves it while the slot is
      # idle, so a restart does not re-prefill the whole 50-80k conversation
      # (~18 KB/token at the q4_0 KV quant; see the README).
      - "${LLAMA_CACHE_DIR:-/mnt/AI/cache}:/cache"
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --metrics
      # Auth: every route except /health and the embedded UI requires the key
      # (verified in the pinned build's source). File is created by `make init`.
      - --api-key-file
      - /run/secrets/llama_api_key
      # Hybrid/WebView mobile apps serve their UI from origin "http://localhost",
      # which is cross-origin to this host; it must be explicitly allowed or the
      # browser's CORS preflight is rejected and the real POST is never sent.
      - --cors-origins
      - http://localhost
      - --slot-save-path
      - /cache
      - --alias
      - "qwen-27b"
      - --jinja
      - -m
      - "/model/model.gguf"
      - --mmproj
      - "/model/mmproj.gguf"
      - --no-mmproj-offload
      - -ngl
      - "999"
      - -np
      - "1"
      - -c
      - "81000"
      - -t
      - "6"
      - -b
      - "2048"
      - -ub
      - "256"
      - --flash-attn
      - "on"
      - -ctk
      - "q4_0"
      - -ctv
      - "q4_0"
      - --spec-type
      - "draft-mtp"
      - --spec-draft-n-max
      - "2"
      - --spec-draft-p-min
      - "0.75"
      - --reasoning
      - "on"
      - --reasoning-format
      - "deepseek"
      - --reasoning-effort
      - "medium"
      - --no-reasoning-preserve
    # /health is public (no key needed). start_period covers
    # the model load; the container is NOT killed on failure (restart: "no"),
    # the status is for `up --wait` and `docker compose ps` to use.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 180s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Host metrics: CPU / RAM / disk + AMD GPU (amdgpu via /sys: drm + hwmon)
  # Read-only mounts; needs /sys to see /sys/class/drm/card*/device
  # ---------------------------------------------------------------------------
  node-exporter:
    # Pinned by digest (verified 2026-11-15): a mutable tag would silently
    # change collector behavior / metric names under the dashboards.
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: llama-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # GPU (busy %, VRAM) is read from /sys/class/drm by the "drm" collector,
      # disabled by default in node-exporter 1.x -> enable explicitly.
      # Temperature / power / fan come from the "hwmon" collector (default on).
      - --collector.drm
      # /proc/net is per network namespace - read from this container
      # it describes the bridge eth0, not the host NICs, so the network
      # collectors would report wrong data. Host network metrics are
      # intentionally not collected (see README).
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 15s
    # The collectors only read /host/{,proc,sys}, so a read-only
    # rootfs without capabilities is sufficient.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev/data:/run/udev/data:ro
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # One-shot init: fix ownership of the prom-data volume.
  # The image's /data dir is empty, so Docker creates the named volume
  # root-owned; prometheus runs as nobody (65534) and needs write access.
  # Exits immediately; a no-op on subsequent starts.
  # ---------------------------------------------------------------------------
  prometheus-init:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: llama-prometheus-init
    user: root
    entrypoint: ["sh", "-c", "chown -R 65534:65534 /data"]
    volumes:
      - prom-data:/data
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus - scrapes node-exporter + llama-server, 2 days retention.
  # Internal only: no published ports (Grafana reaches it on the compose net).
  # llama-server shares the compose network, so it is reached by service
  # name (targets/llama.yml, file_sd refresh every 30 s).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: llama-prometheus
    restart: unless-stopped
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/data
      - --storage.tsdb.retention.time=2d
      # Disk guard on top of the time-based retention.
      - --storage.tsdb.retention.size=2GB
      # --web.enable-lifecycle is deliberately NOT set - it exposes
      # unauthenticated POST /-/reload and /-/quit on the compose network.
      # Reload the config instead with: docker compose kill -s HUP prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 15s
    # /data is a volume (stays writable), the rest of the rootfs is
    # read-only; /tmp is scratch space.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Same key as llama-server: /metrics requires it (see prometheus.yml).
      - ./secrets/llama_api_key:/etc/prometheus/keys/llama_api_key:ro
      - prom-data:/data
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana - provisioning from files (datasource + dashboards, no UI clicks).
  # Published on the LAN interface only (LAN_IP in .env), not 0.0.0.0.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: llama-grafana
    restart: unless-stopped
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # No telemetry / phone-home.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    # Wait for Prometheus before Grafana starts (datasource is provisioned
    # from file, but a healthy Prometheus at first boot avoids empty panels).
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 20s
    # /var/lib/grafana is a volume (stays writable), /tmp is scratch.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # 512, not 128: the server plus its gpx plugin processes legitimately
    # run ~125 threads/processes, and a full pids cgroup made runc exec
    # (healthcheck, plugin start) fail with "procReady not received".
    pids_limit: 512
    logging: *default-logging

volumes:
  prom-data:
  grafana-data:
