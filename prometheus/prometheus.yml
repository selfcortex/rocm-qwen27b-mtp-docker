# Prometheus config for the llama.cpp ROCm monitoring stack.
# Validated with: promtool check config prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: llama-rocm-host

# Alert rules go here in the next stage (Alertmanager).
# Every *.yml in rules/ is picked up automatically; the dir is empty for now.
rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: host

  # llama-server runs with network_mode: host on the host machine.
  # file_sd keeps the target in a separate file, so switching between
  # "server in compose" and "server on host" is a one-line change:
  #   in compose:  targets: ["llama-server:8080"]
  #   on host:     targets: ["host.docker.internal:8080"]
  - job_name: llama
    # /metrics requires the API key (verified in the pinned llama.cpp build:
    # the auth middleware covers all routes except /health and UI assets).
    # credentials_file is re-read on every scrape, so key rotation needs no reload.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/keys/llama_api_key
    file_sd_configs:
      - files: ["targets/llama.yml"]
        refresh_interval: 30s
